name: track-radio

x-common: &common
  image: ${RADIO_IMAGE:?Image obligatoire}
  env_file: .env
  environment:
    DATABASE_URL: sqlite:////app/data/radio.db
    ARCHIVE_DIRECTORY: /app/data/archives
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  volumes:
    - radio_data:/app/data
    - ./config:/app/config:ro
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  api:
    <<: *common

    mem_limit: 160m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/health'); assert c.getresponse().status == 200"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
  collector:
    <<: *common
    command: [python, -m, app.worker]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: [CMD, python, -c, "import time,os; age=time.time()-os.stat('/app/data/collector.heartbeat').st_mtime; deadline=float(os.getenv('REQUEST_TIMEOUT_SECONDS','12'))*int(os.getenv('MAX_STATIONS','50'))/int(os.getenv('COLLECTOR_CONCURRENCY','3'))+int(os.getenv('POLL_INTERVAL_SECONDS','20'))+120; assert age < deadline"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

volumes:
  radio_data:
