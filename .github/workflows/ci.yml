name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app/static/dashboard.js
      - run: bash -n scripts/deploy.sh
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=app --cov-report=term-missing
      - run: python scripts/stations.py --check
      - run: pip-audit --require-hashes -r requirements.lock
      - name: SQLite migrations and restart
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          python scripts/seed.py
          python scripts/seed.py
          alembic downgrade 0001
          alembic upgrade head
  docker:
    needs: test
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test runtime
        run: |
          docker build --target runtime -t radio-smoke .
          docker run -d --name radio-smoke --memory=160m --cpus=0.5 -p 127.0.0.1:8080:8000 -e DATABASE_URL=sqlite:////app/data/radio.db radio-smoke
          trap 'docker logs radio-smoke; docker rm -f radio-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl --fail --silent 'http://127.0.0.1:8080/?station_id=&hours=24' > /dev/null
          curl --fail --silent http://127.0.0.1:8080/static/dashboard.js > /dev/null
          curl --fail --silent 'http://127.0.0.1:8080/api/explore?view=tracks' > /dev/null
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      VPS: ubuntu@129.151.250.229
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' > ~/.ssh/config
      - name: Upload runtime configuration
        run: |
          release="track-radio-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "$VPS" "mkdir -m 700 '$release'"
          tar -czf - compose.production.yaml .env.example config/stations.json scripts/deploy.sh |
            ssh "$VPS" "tar -xzf - -C '$release'"
      - name: Authenticate VPS to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS" \
            "docker --config \"\$HOME/.docker-track-radio-${GITHUB_RUN_ID}\" login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Deploy validated image
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          ssh "$VPS" "export DOCKER_CONFIG=\"\$HOME/.docker-track-radio-${GITHUB_RUN_ID}\"; cd 'track-radio-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; bash scripts/deploy.sh 'ghcr.io/$repository@$IMAGE_DIGEST'"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 http://129.151.250.229/health
      - name: Remove temporary registry credentials
        if: always()
        run: |
          ssh "$VPS" "docker --config \"\$HOME/.docker-track-radio-${GITHUB_RUN_ID}\" logout ghcr.io"

