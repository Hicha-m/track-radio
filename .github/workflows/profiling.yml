name: Profiling audit
on:
  push:
    branches: [profiling]
    paths:
      - 'scripts/profiling/request.json'
permissions:
  contents: read
concurrency:
  group: radio-profiling
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS: ubuntu@129.151.250.229
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' > ~/.ssh/config
      - name: Observe host and application resources
        run: |
          ssh "$VPS" 'bash -s' <<'SH'
          set -euo pipefail
          uptime
          free -m
          df -h /
          vmstat 1 3
          api=$(docker ps -q --filter label=com.docker.compose.project=track-radio --filter label=com.docker.compose.service=api)
          collector=$(docker ps -q --filter label=com.docker.compose.project=track-radio --filter label=com.docker.compose.service=collector)
          test -n "$api"
          docker stats --no-stream --format '{{json .}}' "$api" "$collector"
          for id in "$api" "$collector"; do
            docker inspect --format '{"service":"{{index .Config.Labels "com.docker.compose.service"}}","memory_limit":{{.HostConfig.Memory}},"cpu_limit":{{.HostConfig.NanoCpus}},"oom":{{.State.OOMKilled}},"restarts":{{.RestartCount}},"health":"{{.State.Health.Status}}"}' "$id"
          done
          SH
      - name: Serial HTTP timings inside the server
        run: |
          expected=$(python3 -c 'import json,re; value=json.load(open("scripts/profiling/request.json"))["revision"]; assert re.fullmatch("[a-f0-9]{40}",value); print(value)')
          ssh "$VPS" "api=\$(docker ps -q --filter label=com.docker.compose.project=track-radio --filter label=com.docker.compose.service=api); ip=\$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \"\$api\"); python3 - --base \"http://\$ip:8000\" --expected-revision '$expected'" < scripts/profiling/http_probe.py
      - name: Bounded SQL and Python profile in isolated container
        run: |
          ssh "$VPS" 'bash -c '\''set -euo pipefail
            api=$(docker ps -q --filter label=com.docker.compose.project=track-radio --filter label=com.docker.compose.service=api)
            image=$(docker inspect --format "{{.Config.Image}}" "$api")
            available=$(awk "/MemAvailable:/ {print \$2}" /proc/meminfo)
            if [ "$available" -lt 262144 ]; then echo "Profile skipped: host memory budget"; exit 0; fi
            timeout 120 docker run --rm -i --network none --read-only --memory 160m --cpus 0.25 --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges --volumes-from "$api":ro --tmpfs /tmp:size=16m,mode=1777 --entrypoint python "$image" -
          '\''' < scripts/profiling/sql_profile.py
      - name: Observe resources after probes
        run: |
          ssh "$VPS" 'api=$(docker ps -q --filter label=com.docker.compose.project=track-radio --filter label=com.docker.compose.service=api); collector=$(docker ps -q --filter label=com.docker.compose.project=track-radio --filter label=com.docker.compose.service=collector); docker stats --no-stream --format "{{json .}}" "$api" "$collector"'
      - name: Remove local SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
