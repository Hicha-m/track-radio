services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radio
      POSTGRES_USER: radio
      POSTGRES_PASSWORD: radio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio -d radio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  collector:
    build: .
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

volumes:
  postgres_data:

