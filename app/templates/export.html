<template id="export-template">
  <dialog class="export-dialog" aria-labelledby="export-title">
    <button type="button" class="text-button" data-export-close>{{ t('ui.711e5f2e198d') }}</button>
    <h2 id="export-title">{{ t('ui.47fef94d2b0b') }}</h2>
    <p class="hint">{{ t('ui.32d5776420e8') }}</p>
    <form id="export-form">
      <div class="filter-grid">
        <label>{{ t('ui.6ef4db3c1dca') }}<select name="view"><option value="tracks">{{ t('ui.76a002ddb1d1') }}</option><option value="plays">{{ t('ui.4413ab069b7c') }}</option></select></label>
        <label>{{ t('ui.2a7dfeb2f2b0') }}<select name="station_id"><option value="">{{ t('ui.3d7e6d53866b') }}</option><option value="custom" disabled>{{ t('ui.41297f811c64') }}</option>{% for station in stations %}<option value="{{ station.id }}">{{ station.name }}</option>{% endfor %}</select></label>
        <label>{{ t('ui.a12b73cf58da') }}<input name="q" type="search" maxlength="200"></label>
        <label>{{ t('ui.2966c11adad7') }}<input name="artist" maxlength="300"></label>
        <label>{{ t('ui.78e7920010aa') }}<input name="title" maxlength="500"></label>
        <label>{{ t('ui.6da795a8664f') }}<select name="genre"><option value="">{{ t('ui.84d66eab2f60') }}</option><option value="__unknown__">{{ t('ui.3b986a55bf84') }}</option>{% for genre in genres %}<option>{{ genre }}</option>{% endfor %}</select></label>
        <label>{{ t('ui.cdcede56427e') }}<select name="sort"><option value="frequency">{{ t('ui.ad04815b3c46') }}</option><option value="newest">{{ t('ui.eabfc20d3057') }}</option><option value="oldest">{{ t('ui.697db2e5ddaa') }}</option><option value="artist">{{ t('ui.a43366156f43') }}</option><option value="title">{{ t('ui.9efbe355824c') }}</option><option value="station">{{ t('ui.84ac43bd251f') }}</option></select></label>
        <label>{{ t('ui.3d038789091e') }}<input name="limit" type="number" min="1" max="10000" placeholder="{{ t("ui.20dccddaf5ea") }}"></label>
        <label>{{ t('ui.bc2e12d6abbf') }}<input name="since" type="datetime-local" step="any"></label>
        <label>{{ t('ui.9fc8521f5ab9') }}<input name="until" type="datetime-local" step="any"></label>
        <label>{{ t('ui.2f343666aaa8') }}<select name="format"><option value="csv">{{ t('ui.eb6b42f54c42') }}</option><option value="json">{{ t('ui.db1a21a0bc2e') }}</option></select></label>
      </div>
      <details class="station-selection"><summary>{{ t('ui.df8dd028a8cb') }}</summary><fieldset><legend>{{ t('ui.594ac4d4fabf') }}</legend><p class="hint">{{ t('ui.a5848e0cf5ea') }}</p>{% for station in stations %}<label class="checkbox"><input type="checkbox" data-export-radio value="{{ station.id }}">{{ station.name }}</label>{% endfor %}</fieldset></details>
      <details class="advanced-filters"><summary>{{ t('ui.3fd72b5095f0') }}</summary><div class="filter-grid">
        <label>{{ t('ui.b15feece4022') }}<input name="seen_since" type="datetime-local" step="any"></label>
        <label>{{ t('ui.5827153de36d') }}<input name="seen_until" type="datetime-local" step="any"></label>
        <label>{{ t('ui.0e570ca6fabe') }}<select name="source"><option value="">{{ t('ui.42623b97b481') }}</option><option value="icy">{{ t('ui.cf5860ec52fc') }}</option><option value="json">{{ t('ui.db1a21a0bc2e') }}</option><option value="html">{{ t('ui.07239dbd2a1a') }}</option></select></label>
        <label>{{ t('ui.d4a8e77f1fd6') }}<select name="artist_status"><option value="any">{{ t('ui.df7dacfd557f') }}</option><option value="known">{{ t('ui.0a90407639c4') }}</option><option value="missing">{{ t('ui.7f62496b0cb8') }}</option></select></label>
        <label>{{ t('ui.6c16a4fa7998') }}<select name="enabled"><option value="">{{ t('ui.df7dacfd557f') }}</option><option value="true">{{ t('ui.ad26287ab66b') }}</option><option value="false">{{ t('ui.da60ff35b212') }}</option></select></label>
        <label>{{ t('ui.3c0638f87966') }}<input name="raw" maxlength="200"></label>
        <label>{{ t('ui.cc918a19af76') }}<input name="min_plays" type="number" min="1" value="1"></label>
      </div><label class="checkbox"><input type="checkbox" name="exact"> {{ t('ui.132caa414a16') }}</label></details>
      <p class="hint">{{ t('ui.26132fdea16e') }}</p>
      <fieldset><legend>{{ t('ui.2e709f978ebd') }}</legend>
        <div class="music-tools"><button type="button" data-fields="all">{{ t('ui.5b6fef95fb92') }}</button><button type="button" data-fields="minimal">{{ t('ui.8787c4021d85') }}</button></div>
        <div class="export-fields"></div>
      </fieldset>
      <p data-export-status role="status" aria-live="polite"></p>
      <button type="submit" class="hero-button">{{ t('ui.ee6013eeb826') }}</button>
    </form>
  </dialog>
</template>
