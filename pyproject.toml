[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-tracker"
version = "0.1.0"
description = "Collecte et analyse les titres diffuses par les radios"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "jinja2==3.1.5",
  "psycopg[binary]==3.2.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

